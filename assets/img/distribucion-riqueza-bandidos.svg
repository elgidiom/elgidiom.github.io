<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">Ilustración de distribución desigual de la riqueza</title>
  <desc id="desc">Una multitud está reunida en la parte baja de una colina; más arriba hay menos personas y en la cima solo una persona con mucha riqueza, separada de las demás.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#c7e9ff"/>
      <stop offset=".66" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#fff7ed"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" x2="1" y1="1" y2="0">
      <stop offset="0" stop-color="#9ad7b5"/>
      <stop offset=".58" stop-color="#f5d48a"/>
      <stop offset="1" stop-color="#f5a6a6"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#334155" flood-opacity=".16"/>
    </filter>
    <g id="person-a" stroke="#334155" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="0" r="12" fill="#ffd6a5" stroke="none"/>
      <path d="M0 14 L0 48" stroke="#334155"/>
      <path d="M-18 28 L18 28" stroke="#334155"/>
      <path d="M0 48 L-15 72 M0 48 L15 72" stroke="#334155"/>
    </g>
  </defs>

  <rect width="980" height="560" rx="24" fill="url(#sky)"/>

  <circle cx="112" cy="96" r="44" fill="#ffd166" opacity=".9"/>
  <g fill="#ffffff" opacity=".92">
    <ellipse cx="242" cy="94" rx="54" ry="22"/>
    <ellipse cx="282" cy="84" rx="42" ry="20"/>
    <ellipse cx="322" cy="98" rx="58" ry="24"/>
    <ellipse cx="724" cy="142" rx="62" ry="24"/>
    <ellipse cx="770" cy="130" rx="46" ry="20"/>
    <ellipse cx="814" cy="146" rx="58" ry="24"/>
  </g>

  <path d="M44 504 C190 440, 294 430, 406 384 C524 336, 588 258, 704 198 C796 151, 874 132, 940 96 L940 504 Z" fill="url(#hill)" filter="url(#softShadow)"/>
  <path d="M60 506 C240 458, 382 432, 520 378 C656 324, 742 240, 918 168" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" opacity=".68"/>
  <path d="M60 506 C240 458, 382 432, 520 378 C656 324, 742 240, 918 168" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 18" opacity=".45"/>

  <g font-family="Inter, Arial, sans-serif" font-weight="800" fill="#334155">
    <text x="74" y="210" font-size="26">abajo hay muchos</text>
    <text x="498" y="186" font-size="24">subir separa</text>
    <text x="684" y="66" font-size="23">arriba</text>
    <text x="666" y="92" font-size="23">casi nadie</text>
  </g>

  <g transform="translate(116 390) scale(.82)"><use href="#person-a"/><path d="M-18 18 Q0 4 18 18" fill="none" stroke="#ef476f" stroke-width="5" stroke-linecap="round"/></g>
  <g transform="translate(168 410) scale(.78)"><use href="#person-a"/><path d="M-18 18 Q0 4 18 18" fill="none" stroke="#118ab2" stroke-width="5" stroke-linecap="round"/></g>
  <g transform="translate(218 386) scale(.82)"><use href="#person-a"/><path d="M-18 18 Q0 4 18 18" fill="none" stroke="#06d6a0" stroke-width="5" stroke-linecap="round"/></g>
  <g transform="translate(270 410) scale(.78)"><use href="#person-a"/><path d="M-18 18 Q0 4 18 18" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/></g>
  <g transform="translate(320 378) scale(.8)"><use href="#person-a"/><path d="M-18 18 Q0 4 18 18" fill="none" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round"/></g>
  <g transform="translate(142 468) scale(.72)"><use href="#person-a"/><path d="M-18 18 Q0 4 18 18" fill="none" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round"/></g>
  <g transform="translate(200 478) scale(.7)"><use href="#person-a"/><path d="M-18 18 Q0 4 18 18" fill="none" stroke="#ef476f" stroke-width="5" stroke-linecap="round"/></g>
  <g transform="translate(258 462) scale(.72)"><use href="#person-a"/><path d="M-18 18 Q0 4 18 18" fill="none" stroke="#118ab2" stroke-width="5" stroke-linecap="round"/></g>
  <g transform="translate(316 474) scale(.7)"><use href="#person-a"/><path d="M-18 18 Q0 4 18 18" fill="none" stroke="#06d6a0" stroke-width="5" stroke-linecap="round"/></g>
  <g transform="translate(374 446) scale(.74)"><use href="#person-a"/><path d="M-18 18 Q0 4 18 18" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/></g>

  <g transform="translate(506 326) scale(.86)"><use href="#person-a"/><path d="M-18 18 Q0 4 18 18" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/></g>
  <g transform="translate(586 284) scale(.88)"><use href="#person-a"/><path d="M-18 18 Q0 4 18 18" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/></g>
  <g transform="translate(694 220) scale(.92)"><use href="#person-a"/><path d="M-18 18 Q0 4 18 18" fill="none" stroke="#d97706" stroke-width="5" stroke-linecap="round"/></g>

  <g transform="translate(860 138)" filter="url(#softShadow)">
    <circle cx="0" cy="-18" r="18" fill="#ffd6a5"/>
    <path d="M0 2 L0 58" stroke="#334155" stroke-width="7" stroke-linecap="round"/>
    <path d="M-28 22 L28 22" stroke="#334155" stroke-width="7" stroke-linecap="round"/>
    <path d="M0 58 L-20 94 M0 58 L20 94" stroke="#334155" stroke-width="7" stroke-linecap="round"/>
    <path d="M-26 7 Q0 -15 26 7" fill="none" stroke="#be123c" stroke-width="8" stroke-linecap="round"/>
    <circle cx="54" cy="-18" r="22" fill="#fbbf24"/>
    <text x="43" y="-9" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="900" fill="#7c2d12">$</text>
    <circle cx="26" cy="-48" r="11" fill="#fbbf24"/>
    <circle cx="76" cy="-48" r="11" fill="#fbbf24"/>
  </g>

  <g fill="#ffffff" opacity=".72">
    <circle cx="502" cy="246" r="5"/>
    <circle cx="546" cy="232" r="4"/>
    <circle cx="632" cy="184" r="5"/>
    <circle cx="756" cy="134" r="4"/>
    <circle cx="802" cy="112" r="5"/>
  </g>
</svg>
