<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Portada atmosférica para el cuento Premonición</title>
  <desc id="desc">Una fachada oscura vista desde la calle de noche, con una ventana encendida tras una cortina amarilla bordada de flores pequeñas y dos ojos apenas visibles flotando en la penumbra.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1519"/>
      <stop offset="55%" stop-color="#0f1f26"/>
      <stop offset="100%" stop-color="#1b2424"/>
    </linearGradient>
    <linearGradient id="street" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1615"/>
      <stop offset="100%" stop-color="#050707"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151d1e"/>
      <stop offset="100%" stop-color="#0c1213"/>
    </linearGradient>
    <linearGradient id="curtain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7d089"/>
      <stop offset="45%" stop-color="#f0b96a"/>
      <stop offset="100%" stop-color="#d99a4e"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#89a6a4" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#f3b56e" stop-opacity=".06"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f4bd72" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#f4bd72" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iris" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#dfe9e4" stop-opacity=".85"/>
      <stop offset="60%" stop-color="#8fa9a3" stop-opacity=".4"/>
      <stop offset="100%" stop-color="#8fa9a3" stop-opacity="0"/>
    </radialGradient>

    <pattern id="flores" width="46" height="46" patternUnits="userSpaceOnUse">
      <g fill="#b9793a" opacity=".5">
        <circle cx="12" cy="8" r="3.1"/>
        <circle cx="18" cy="13" r="3.1"/>
        <circle cx="12" cy="18" r="3.1"/>
        <circle cx="6" cy="13" r="3.1"/>
        <circle cx="12" cy="13" r="2.1" fill="#8d5a28"/>
      </g>
      <g fill="#b9793a" opacity=".38">
        <circle cx="35" cy="31" r="2.7"/>
        <circle cx="40" cy="35" r="2.7"/>
        <circle cx="35" cy="39" r="2.7"/>
        <circle cx="30" cy="35" r="2.7"/>
        <circle cx="35" cy="35" r="1.8" fill="#8d5a28"/>
      </g>
    </pattern>

    <filter id="blur-sm" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="blur-md" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="blur-lg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="23"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.06"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)"/>

  <g opacity=".85">
    <rect x="-20" y="120" width="300" height="400" fill="#0e1517"/>
    <rect x="960" y="95" width="270" height="425" fill="#0d1416"/>
  </g>

  <rect x="250" y="60" width="720" height="460" fill="url(#wall)"/>
  <rect x="250" y="60" width="720" height="10" fill="#1a2323" opacity=".7"/>

  <g stroke="#7d8f8c" stroke-opacity=".05">
    <line x1="250" y1="170" x2="970" y2="170"/>
    <line x1="250" y1="290" x2="970" y2="290"/>
    <line x1="250" y1="410" x2="970" y2="410"/>
  </g>

  <ellipse cx="612" cy="278" rx="360" ry="300" fill="url(#glow)" filter="url(#blur-lg)"/>

  <g>
    <rect x="446" y="150" width="332" height="256" rx="4" fill="#0a0f10"/>
    <rect x="458" y="162" width="308" height="232" fill="url(#curtain)" opacity=".93"/>
    <rect x="458" y="162" width="308" height="232" fill="url(#flores)"/>

    <g fill="#c98f45" opacity=".22">
      <rect x="470" y="162" width="12" height="232"/>
      <rect x="512" y="162" width="9" height="232"/>
      <rect x="556" y="162" width="13" height="232"/>
      <rect x="604" y="162" width="8" height="232"/>
      <rect x="648" y="162" width="12" height="232"/>
      <rect x="694" y="162" width="10" height="232"/>
      <rect x="738" y="162" width="13" height="232"/>
    </g>

    <g fill="#3d2a16" opacity=".3" filter="url(#blur-md)">
      <ellipse cx="640" cy="330" rx="120" ry="90"/>
    </g>

    <g fill="none" stroke="#0a0f10" stroke-width="10" opacity=".9">
      <line x1="612" y1="162" x2="612" y2="394"/>
      <line x1="458" y1="278" x2="766" y2="278"/>
    </g>
    <rect x="446" y="150" width="332" height="256" rx="4" fill="none" stroke="#141b1b" stroke-width="12"/>
  </g>

  <rect x="424" y="406" width="376" height="16" rx="3" fill="#101616"/>

  <g filter="url(#blur-sm)" opacity=".92">
    <ellipse cx="318" cy="352" rx="26" ry="13" fill="url(#iris)"/>
    <ellipse cx="392" cy="352" rx="26" ry="13" fill="url(#iris)"/>
  </g>
  <g opacity=".55">
    <ellipse cx="318" cy="352" rx="7" ry="6" fill="#e8f0ea"/>
    <ellipse cx="392" cy="352" rx="7" ry="6" fill="#e8f0ea"/>
  </g>
  <ellipse cx="355" cy="356" rx="120" ry="105" fill="#050808" opacity=".35" filter="url(#blur-lg)"/>

  <rect y="470" width="1200" height="160" fill="url(#street)"/>
  <rect x="0" y="470" width="1200" height="160" fill="#0a0d0c" opacity=".55"/>
  <path d="M0 500 C140 488, 260 522, 380 507 S610 488, 760 512 S980 528, 1200 498 L1200 630 L0 630 Z" fill="#040606" opacity=".84"/>

  <g opacity=".5" filter="url(#blur-md)">
    <ellipse cx="612" cy="520" rx="230" ry="34" fill="#efb36a" opacity=".18"/>
  </g>

  <g stroke="#d9e1e0" stroke-opacity=".08">
    <line x1="230" y1="60" x2="150" y2="630"/>
    <line x1="1000" y1="60" x2="1080" y2="630"/>
  </g>

  <rect width="1200" height="630" fill="url(#mist)" opacity=".55"/>
  <rect width="1200" height="630" filter="url(#grain)" opacity=".65"/>
  <rect width="1200" height="630" fill="#041012" opacity=".18"/>
</svg>
